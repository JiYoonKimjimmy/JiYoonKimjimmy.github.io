<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-labelledby="t3 d3" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', sans-serif">
  <title id="t3">응답시간 분포 위에 놓인 중앙값·평균·p95·max</title>
  <desc id="d3">응답시간 분포는 오른쪽으로 긴 꼬리를 가지므로 평균이 중앙값보다 오른쪽에 놓이고, p95는 꼬리를 포함하되 극단값은 배제한다.</desc>
  <rect width="720" height="230" fill="#f8fafc"/>

  <line x1="44" y1="170" x2="700" y2="170" stroke="#cbd5e1"/>
  <path d="M44,170 C126,170 146,44 210,44 C262,44 282,128 352,150 C434,163 534,168 700,169 L700,170 Z"
        fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/>

  <line x1="214" y1="38" x2="214" y2="180" stroke="#15803d" stroke-width="1.8"/>
  <text x="214" y="30" fill="#15803d" font-size="11.5" text-anchor="middle">20ms</text>
  <text x="214" y="197" fill="#15803d" font-size="11.5" text-anchor="middle" font-weight="600">med (p50)</text>

  <line x1="280" y1="64" x2="280" y2="180" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="286" y="56" fill="#64748b" font-size="11.5">35ms</text>
  <text x="280" y="197" fill="#64748b" font-size="11.5" text-anchor="middle">avg</text>

  <line x1="440" y1="128" x2="440" y2="180" stroke="#b45309" stroke-width="1.8"/>
  <text x="440" y="120" fill="#b45309" font-size="11.5" text-anchor="middle">90ms</text>
  <text x="440" y="197" fill="#b45309" font-size="11.5" text-anchor="middle" font-weight="600">p95</text>

  <line x1="664" y1="156" x2="664" y2="180" stroke="#b45309" stroke-width="1.4"/>
  <text x="664" y="148" fill="#b45309" font-size="11.5" text-anchor="middle">1.2s</text>
  <text x="664" y="197" fill="#b45309" font-size="11.5" text-anchor="middle">max</text>

  <text x="44" y="216" fill="#64748b" font-size="11">← 빠름</text>
  <text x="700" y="216" fill="#64748b" font-size="11" text-anchor="end">느림 →</text>
  <text x="360" y="216" fill="#94a3b8" font-size="10.5" text-anchor="middle">수치는 설명용 예시</text>
</svg>
