  <text x="510" y="77" fill="#0f766e" font-size="12.5" text-anchor="middle">애플리케이션</text>

  <rect x="640" y="52" width="76" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="678" y="77" fill="#64748b" font-size="12.5" text-anchor="middle">DB·외부</text>

