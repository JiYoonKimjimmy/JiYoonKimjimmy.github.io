<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="t1 d1" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', sans-serif">
  <title id="t1">닫힌 모델과 열린 모델의 부하 생성 방식 비교</title>
  <desc id="d1">닫힌 모델은 응답을 받아야 다음 요청을 보내므로 서버가 느려지면 부하도 줄어들고, 열린 모델은 서버 상태와 무관하게 일정한 도착률로 요청을 보낸다.</desc>
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#0d9488"/>
    </marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="720" height="280" fill="#f8fafc"/>

  <text x="8" y="24" fill="#1e293b" font-size="14" font-weight="700">닫힌 모델 · closed</text>
  <text x="152" y="24" fill="#64748b" font-size="12">VU 수를 지정한다</text>

  <rect x="8" y="42" width="104" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="66" fill="#334155" font-size="13" text-anchor="middle">VU 100명</text>
  <path d="M116,61 L184,61" stroke="#0d9488" stroke-width="1.6" fill="none" marker-end="url(#a1)"/>
  <rect x="190" y="42" width="104" height="38" rx="6" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="242" y="66" fill="#0f766e" font-size="13" text-anchor="middle">서버</text>
  <path d="M242,84 L242,104 L60,104 L60,84" stroke="#94a3b8" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#a2)"/>
  <text x="151" y="122" fill="#64748b" font-size="11.5" text-anchor="middle">응답을 받아야 다음 요청</text>

  <text x="330" y="52" fill="#334155" font-size="12.5">서버가 느려지면 → 보내는 부하도 <tspan fill="#b45309" font-weight="600">함께 줄어듦</tspan></text>
  <text x="330" y="74" fill="#334155" font-size="12.5">서버가 빨라지면 → 보내는 부하가 <tspan fill="#b45309" font-weight="600">함께 늘어남</tspan></text>
  <text x="330" y="98" fill="#b45309" font-size="12">가장 나쁜 순간의 표본이 빠짐 — coordinated omission</text>
  <text x="330" y="119" fill="#64748b" font-size="11.5">“동시 사용자 N명” 재현에 적합</text>

  <line x1="8" y1="146" x2="712" y2="146" stroke="#e2e8f0"/>

  <text x="8" y="176" fill="#1e293b" font-size="14" font-weight="700">열린 모델 · open</text>
  <text x="152" y="176" fill="#64748b" font-size="12">도착률(초당 건수)을 지정한다</text>

  <rect x="8" y="194" width="104" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="218" fill="#334155" font-size="13" text-anchor="middle">초당 500건</text>
  <path d="M116,213 L184,213" stroke="#0d9488" stroke-width="1.6" fill="none" marker-end="url(#a1)"/>
  <rect x="190" y="194" width="104" height="38" rx="6" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="242" y="218" fill="#0f766e" font-size="13" text-anchor="middle">서버</text>
  <text x="151" y="252" fill="#64748b" font-size="11.5" text-anchor="middle">응답과 무관하게 계속 출발</text>

  <text x="330" y="206" fill="#334155" font-size="12.5">서버 상태와 무관하게 <tspan fill="#15803d" font-weight="600">일정하게</tspan> 도착</text>
  <text x="330" y="228" fill="#334155" font-size="12.5">대신 요청을 들고 있을 <tspan font-weight="600">VU 풀</tspan>이 따로 필요</text>
  <text x="330" y="250" fill="#64748b" font-size="11.5">“목표 TPS 를 견디는가” 재현에 적합</text>
</svg>
